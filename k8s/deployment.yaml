apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-sre-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-sre-demo
  template:
    metadata:
      labels:
        app: devops-sre-demo
    spec:
      containers:
      - name: app
        image: devops-sre-demo:latest
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
