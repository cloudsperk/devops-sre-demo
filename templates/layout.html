<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Parking Registration{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <div class="background-grid"></div>
    <div class="container">
      <header class="page-header">
        <div class="spray-tag">ParkSmart</div>
        {% if session.mobile %}
          <div class="user-bar">
            <span>Logged in as <strong>{{ session.mobile }}</strong></span>
            <a href="{{ url_for('logout') }}" class="ghost-button">Logout</a>
          </div>
        {% endif %}
      </header>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="messages">
            {% for category, message in messages %}
              <div class="message {{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <main class="page-panel">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
